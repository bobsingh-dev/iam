[project]
name="mcp-identity-inventory"
version= "0.1.0"
description= "a small read-only mcp server for exploring fictional identities"
requires-python= ">=3.12"
dependencies= [
	"mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
	"pytest",
	"ruff",
	"mypy",
]


[tool.ruff]
target-version= "py312"
line-length= 88

[tool.ruff.lint]
select = ["E", "F", "I"]


[tool.mypy]
python_version = "3.12"
strict = true



